name: Android CI Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore app/ci.keystore \
            -storepass gikoko2026 -keypass gikoko2026 \
            -alias gikoko -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GIkoko, OU=Icon, O=GIkoko, L=Yangon, C=MM"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/GIKOKO-ICON-release.apk

      - name: Verify signature
        shell: bash
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --print-certs out/GIKOKO-ICON-release.apk | head -n 5 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIKOKO-ICON-release
          path: out/GIKOKO-ICON-release.apk

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.0.2"
          gh release create "$TAG" out/GIKOKO-ICON-release.apk \
            --title "GIKOKO ICON $TAG" \
            --notes "GIKOKO ICON 0.0.2: gold Myanmar Kanot icon pack. Apply once in your launcher icon pack settings and every icon changes at once - no shortcuts, no duplicates. 25 hand-drawn gold kanot icons (phone, messages, WhatsApp, Instagram, Facebook, Telegram, camera, Chrome, Play Store, YouTube, Gmail, Maps, clock, calculator, calendar, settings, files, music, video and more). Works with Nova, Lawnchair, Niagara, Apex, Smart, GO." \
            --target "$GITHUB_SHA" || true

      - name: Post build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# CI build failed - debug log"
            echo
            tail -n 400 build.log || true
            echo
            grep -n -i "error\|FAILED" build.log | tail -n 40 || true
          } > /tmp/body.md
          gh issue create --title "CI build failed - debug log" --body-file /tmp/body.md || true
